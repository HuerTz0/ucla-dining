name: Daily Menu Scraper

on:
  schedule:
    # Runs automatically every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper/main.py

      - name: Commit updated JSON back to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add frontend/public/menu_data.json
          git commit -m "Auto-update menu data [skip ci]" || exit 0
          git push
